name: 모드 목록 업데이트

on:
  push:
    branches: [main]
    paths:
      - mods.txt
      - pack.toml
      - config/**
      - resourcepacks/**
      - shaderpacks/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-mods
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 모드 목록 만들기
        id: sync
        run: python tools/sync_mods.py

      - name: 결과를 요약에 표시
        if: always()
        run: cat sync_report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: 바뀐 내용 저장
        if: always() && steps.sync.outcome != 'cancelled'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mods index.toml pack.toml sync_report.md
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "모드 목록 자동 업데이트"
            git push
          fi
